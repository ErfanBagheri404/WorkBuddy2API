name: Release

# Every push to main tags the merged commit with the next patch version,
# builds for all platforms, and publishes a GitHub Release with binaries
# attached. Nothing is committed back to main, so the branch ruleset is
# never bypassed.
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    needs: version
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            artifact: WorkBuddy2API-windows-amd64.exe
          - goos: linux
            goarch: amd64
            artifact: WorkBuddy2API-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: WorkBuddy2API-linux-arm64
          - goos: darwin
            goarch: amd64
            artifact: WorkBuddy2API-macos-amd64
          - goos: darwin
            goarch: arm64
            artifact: WorkBuddy2API-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          name="${{ matrix.artifact }}"
          # strip suffix for non-exe builds
          go build -ldflags "-X main.Version=v${version}" -o "${name}" .
          echo "Built ${name}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync tags
        run: |
          set -euo pipefail
          git fetch origin --tags --force

      - name: Compute next version from tags
        id: bump
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          # Re-running a workflow for an already-tagged commit must not mint
          # a new version, and an existing tag must point at this commit.
          existing="$(git tag --points-at "$sha" --list 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          latest="$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          if [ -n "$existing" ]; then
            next="$existing"
            echo "HEAD already tagged v${existing}; reusing ${next}"
          else
            if [ -z "$latest" ]; then
              current="0.0.0"
            else
              current="$latest"
            fi
            IFS='.' read -r major minor patch <<< "$current"
            next="${major}.${minor}.$((patch + 1))"
            echo "Next patch version: ${current} -> ${next}"
          fi
          if [[ ! "$next" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::computed version ${next} is not a release version"
            exit 1
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.sha }}

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f | while read f; do
            cp "$f" release/
          done
          ls release/

      - name: Build release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          version="$VERSION"
          prev="$(git tag -l 'v*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | awk -v v="$version" '$0 < v' | tail -1 || true)"
          {
            echo "## What changed"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty=format:"- %s (%h)" "v${prev}..HEAD"
            else
              git log --no-merges --pretty=format:"- %s (%h)" HEAD
            fi
            echo
            echo
            echo "## Install"
            echo
            echo "Download the binary for your platform below."
          } > RELEASE_NOTES.md

      - name: Tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="$VERSION"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            tag_sha="$(git rev-parse "refs/tags/v${version}^{commit}")"
            if [ "$tag_sha" != "$(git rev-parse HEAD)" ]; then
              echo "::error::tag v${version} points at ${tag_sha}, not HEAD"
              exit 1
            fi
            echo "tag v${version} already points at HEAD; nothing to push"
          else
            git tag "v${version}"
            git push origin "v${version}"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.version.outputs.version }}"
          name: "v${{ needs.version.outputs.version }}"
          body_path: RELEASE_NOTES.md
          files: release/*
          make_latest: true
