name: Release

# Every push to main bumps the patch version, tags it, builds the exe and
# publishes a GitHub Release with the commit log as release notes.
on:
  push:
    branches: [main]
    paths-ignore:
      - "VERSION"
      - "*.md"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Bump patch version
        id: bump
        shell: bash
        run: |
          set -euo pipefail
          current="$(tr -d '[:space:]' < VERSION)"
          IFS='.' read -r major minor patch <<< "$current"
          next="${major}.${minor}.$((patch + 1))"
          echo "$next" > VERSION
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Bumped $current -> $next"

      - name: Build
        shell: bash
        run: go build -ldflags "-X main.Version=v${{ steps.bump.outputs.version }}" -o WorkBuddy2API.exe .

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          {
            echo "## What changed"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty=format:"- %s (%h)" "${prev}..HEAD"
            else
              git log --no-merges --pretty=format:"- %s (%h)" HEAD
            fi
            echo
            echo
            echo "## Install"
            echo
            echo "Download \`WorkBuddy2API.exe\` below and run it."
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Commit version bump
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          git push

      - name: Tag
        shell: bash
        run: |
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "v${{ steps.bump.outputs.version }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.bump.outputs.version }}"
          name: "v${{ steps.bump.outputs.version }}"
          body_path: RELEASE_NOTES.md
          files: WorkBuddy2API.exe
          make_latest: true
