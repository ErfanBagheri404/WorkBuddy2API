name: Release

# Every push to main bumps the patch version, tags it, builds for all
# platforms, and publishes a GitHub Release with binaries attached.
on:
  push:
    branches: [main]
    paths-ignore:
      - "VERSION"
      - "*.md"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            artifact: WorkBuddy2API-windows-amd64.exe
          - goos: linux
            goarch: amd64
            artifact: WorkBuddy2API-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: WorkBuddy2API-linux-arm64
          - goos: darwin
            goarch: amd64
            artifact: WorkBuddy2API-macos-amd64
          - goos: darwin
            goarch: arm64
            artifact: WorkBuddy2API-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          name="${{ matrix.artifact }}"
          # strip suffix for non-exe builds
          go build -ldflags "-X main.Version=v${version}" -o "${name}" .
          echo "Built ${name}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version
        id: bump
        run: |
          set -euo pipefail
          current="$(tr -d '[:space:]' < VERSION)"
          IFS='.' read -r major minor patch <<< "$current"
          next="${major}.${minor}.$((patch + 1))"
          echo "$next" > VERSION
          echo "version=$next" >> "$GITHUB_OUTPUT"
          echo "Bumped $current -> $next"

      - name: Commit version bump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: release v${{ steps.bump.outputs.version }} [skip ci]"
          git push

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f | while read f; do
            cp "$f" release/
          done
          ls release/

      - name: Build release notes
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          {
            echo "## What changed"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty=format:"- %s (%h)" "${prev}..HEAD"
            else
              git log --no-merges --pretty=format:"- %s (%h)" HEAD
            fi
            echo
            echo
            echo "## Install"
            echo
            echo "Download the binary for your platform below."
          } > RELEASE_NOTES.md

      - name: Tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="${{ needs.version.outputs.version }}"
          git tag "v${version}"
          git push origin "v${version}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.version.outputs.version }}"
          name: "v${{ needs.version.outputs.version }}"
          body_path: RELEASE_NOTES.md
          files: release/*
          make_latest: true
