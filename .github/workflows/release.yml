name: Release

# Every push to main tags the merged commit with the next patch version,
# builds for all platforms, and publishes a GitHub Release with binaries
# attached. Nothing is committed back to main, so the branch ruleset is
# never bypassed.
on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    needs: version
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            artifact: WorkBuddy2API-windows-amd64.exe
          - goos: linux
            goarch: amd64
            artifact: WorkBuddy2API-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: WorkBuddy2API-linux-arm64
          - goos: darwin
            goarch: amd64
            artifact: WorkBuddy2API-macos-amd64
          - goos: darwin
            goarch: arm64
            artifact: WorkBuddy2API-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          name="${{ matrix.artifact }}"
          # strip suffix for non-exe builds
          go build -ldflags "-X main.Version=v${version}" -o "${name}" .
          echo "Built ${name}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync to current main tip
        run: |
          set -euo pipefail
          git fetch origin main --tags --force
          git reset --hard origin/main

      - name: Compute next version from tags
        id: bump
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          # Re-running a workflow for an already-tagged commit must not mint
          # a new version.
          if existing="$(git tag --points-at "$sha" --list 'v*' | head -n1)" && [ -n "$existing" ]; then
            next="${existing#v}"
            echo "HEAD already tagged ${existing}; reusing ${next}"
          else
            latest="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo v0.0.0)"
            current="${latest#v}"
            IFS='.' read -r major minor patch <<< "$current"
            next="${major}.${minor}.$((patch + 1))"
            echo "Next patch version: ${current} -> ${next}"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f | while read f; do
            cp "$f" release/
          done
          ls release/

      - name: Build release notes
        run: |
          set -euo pipefail
          version="${{ needs.version.outputs.version }}"
          prev="$(git describe --tags --abbrev=0 --match 'v*' --exclude "v${version}" 2>/dev/null || echo '')"
          {
            echo "## What changed"
            echo
            if [ -n "$prev" ]; then
              git log --no-merges --pretty=format:"- %s (%h)" "${prev}..HEAD"
            else
              git log --no-merges --pretty=format:"- %s (%h)" HEAD
            fi
            echo
            echo
            echo "## Install"
            echo
            echo "Download the binary for your platform below."
          } > RELEASE_NOTES.md

      - name: Tag
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          version="${{ needs.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "tag v${version} already exists; nothing to push"
          else
            git tag "v${version}"
            git push origin "v${version}"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.version.outputs.version }}"
          name: "v${{ needs.version.outputs.version }}"
          body_path: RELEASE_NOTES.md
          files: release/*
          make_latest: true
