name: Release

# Cut a release by pushing a tag:  git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: go build -ldflags "-X main.Version=${{ github.ref_name }}" -o WorkBuddy2API.exe .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: WorkBuddy2API.exe
          generate_release_notes: true
